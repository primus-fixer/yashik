[package]
name = "yashik-core"
description = "Ядро «Ящика»: записи и чем приложение отличается от других на kit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Общий модуль kit 0.12.0 (https://github.com/primus-fixer/kit): хранилище записей, обмен по Wi-Fi,
# облако и формат копий. Ссылка — на коммит версии; когда у kit есть метка, `rev` заменяется на `tag`.
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "50713b7a11d54fb74403666eb6cf63c13e7df514", features = ["store"] }
getrandom = "0.3"
