[package]
name = "yashik-core"
description = "Ядро «Ящика»: записи и чем приложение отличается от других на kit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Общий модуль kit 0.12.1 (https://github.com/primus-fixer/kit): хранилище записей, обмен по Wi-Fi,
# облако и формат копий. Ссылка — на коммит версии; когда у kit есть метка, `rev` заменяется на `tag`.
kit-core = { git = "https://github.com/primus-fixer/kit", rev = "8fe923477d34668bbcb09a5c3355457332e78a18", features = ["store"] }
getrandom = "0.3"
# Основы слов для поиска (Snowball: русский и английский).
rust-stemmers = "1.2"
# Почта: IMAP поверх TLS (rustls с ring, корни Mozilla — одинаково на Windows и Android).
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["net", "time", "rt", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1"
futures = "0.3"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# Проверка TLS: свой сертификат для сервера в тесте.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
serde_json = "1"
