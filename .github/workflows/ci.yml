name: Проверки

# Проверки — на pull request и после слияния в main; правка только описаний их не запускает.
on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# Проверкам токен GitHub нужен только для чтения кода.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Ядро и мост — тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: core
      - name: Библиотеки WebKit для моста Tauri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - name: Интерфейс для моста (frontendDist)
        working-directory: app
        run: npm ci && npm run build
      # Сервер IMAP для проверок почты: ящик-образец в памяти (demouser / demopass).
      - name: Сервер IMAP pymap
        run: |
          python3 -m venv "$RUNNER_TEMP/pymap"
          "$RUNNER_TEMP/pymap/bin/pip" install -q pymap==0.36.7
          echo "YASHIK_PYMAP=$RUNNER_TEMP/pymap/bin/pymap" >> "$GITHUB_ENV"
      - run: cargo test -p yashik-core -p yashik-app

  frontend:
    name: Интерфейс — сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build
